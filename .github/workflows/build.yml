name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Download Dalamud
        run: |
          wget https://goatcorp.github.io/dalamud-distrib/latest.zip -O /tmp/dalamud.zip
          unzip /tmp/dalamud.zip -d /tmp/dalamud

      - name: Restore
        run: dotnet restore CountdownHide/CountdownHide.csproj
        env:
          DALAMUD_HOME: /tmp/dalamud

      - name: Build
        run: dotnet build CountdownHide/CountdownHide.csproj --configuration Release --no-restore
        env:
          DALAMUD_HOME: /tmp/dalamud

      - name: Package
        run: |
          VERSION=$(grep '<Version>' CountdownHide/CountdownHide.csproj | sed 's/.*<Version>\(.*\)<\/Version>.*/\1/' | tr -d '[:space:]')
          echo "Packaging version $VERSION"
          mkdir -p dist
          find CountdownHide/bin/Release -name "CountdownHide.dll" | head -1 | xargs -I{} cp {} dist/
          # Inject the version into the plugin manifest so Dalamud reads the correct version
          jq --arg v "$VERSION" '.AssemblyVersion = $v' CountdownHide/CountdownHide.json > dist/CountdownHide.json
          cd dist && zip -r ../latest.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CountdownHide
          path: latest.zip

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: latest.zip
          generate_release_notes: true
