name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Download Dalamud
        run: |
          wget https://goatcorp.github.io/dalamud-distrib/latest.zip -O /tmp/dalamud.zip
          mkdir -p ~/.xlcore/dalamud/Hooks/dev/
          unzip /tmp/dalamud.zip -d ~/.xlcore/dalamud/Hooks/dev/

      - name: Restore
        run: dotnet restore CountdownHide/CountdownHide.csproj

      - name: Build
        run: dotnet build CountdownHide/CountdownHide.csproj --configuration Release --no-restore

      - name: Package
        run: |
          mkdir -p dist/CountdownHide
          find CountdownHide/bin/Release -name "CountdownHide.dll" | head -1 | xargs -I{} cp {} dist/CountdownHide/
          cp CountdownHide/CountdownHide.json dist/CountdownHide/
          cd dist && zip -r ../latest.zip CountdownHide/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CountdownHide
          path: latest.zip

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: latest.zip
          generate_release_notes: true
